<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0E5C46" />
    <title>LoanHisab — You're offline</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0;
        background:
          radial-gradient(560px 240px at 20% 15%, rgba(18,118,90,.09), transparent 70%),
          radial-gradient(420px 220px at 80% 80%, rgba(233,142,21,.12), transparent 70%),
          #f6f1e5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
        color: #14211b;
        padding: 24px;
        padding-top: max(24px, env(safe-area-inset-top));
        padding-bottom: max(24px, env(safe-area-inset-bottom));
        text-align: center;
      }
      .tricolor {
        position: fixed; top: 0; left: 0; right: 0; height: 3px;
        background: linear-gradient(to right, #f4760b 33.33%, #ffffff 33.33% 66.67%, #138808 66.67%);
      }
      .mark {
        width: 72px; height: 72px; border-radius: 20px;
        display: grid; place-items: center;
        background: linear-gradient(155deg, #e98e15 -10%, #0e5c46 60%, #0b4a39);
        box-shadow: 0 10px 26px rgba(11,59,46,.28);
        margin-bottom: 22px;
      }
      .mark svg { width: 38px; height: 38px; }
      h1 { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
      h1 span { color: #0e5c46; }
      h2 { margin-top: 26px; font-size: 19px; font-weight: 700; }
      p { margin-top: 8px; max-width: 320px; font-size: 14px; line-height: 1.6; color: #5b6b62; }
      button {
        margin-top: 22px;
        display: inline-flex; align-items: center; gap: 8px;
        border: 0; border-radius: 999px;
        background: #0e5c46; color: #fff;
        font: 600 15px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        padding: 15px 28px; cursor: pointer;
        box-shadow: 0 8px 20px rgba(11,59,46,.25);
        min-height: 48px; min-width: 120px; justify-content: center;
      }
      button:active { transform: scale(.97); }
      .note { margin-top: 28px; font-size: 12px; color: #82948a; }
      @media (prefers-reduced-motion: no-preference) {
        .mark { animation: bob 2.4s ease-in-out infinite; }
        @keyframes bob { 50% { transform: translateY(-6px); } }
      }
    </style>
  </head>
  <body>
    <div class="tricolor"></div>
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 3h12"/><path d="M6 8h12"/><path d="m6 13 8.5 8"/><path d="M6 13h3"/>
        <path d="M9 13c6.667 0 6.667-10 0-10"/>
      </svg>
    </div>
    <h1>Loan<span>Hisab</span></h1>
    <h2>You're offline</h2>
    <p>Please check your internet connection and try again. If LoanHisab had loaded before, it should still work — this page only appears when nothing is cached yet.</p>
    <button type="button" onclick="location.reload()">Retry</button>
    <p class="note">LoanHisab · Indian Loan Calculator</p>
  </body>
</html>
